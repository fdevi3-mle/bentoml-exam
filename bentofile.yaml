service: "src.service:admission_service"
description: "Admission Prediciton "
labels:
  owner: "Francois NOV 24BDS MLE"
  project: "bentoml"

docker:
  dockerfile_template: "./Dockerfile.template"
  base_image: python:3.12-slim

include:
  - src/
  - data/
  - utils.py
  - zenml-main.py
  - '*.py'

python:
  packages:
    - "numpy"
    - "pandas"
    - "scikit-learn"
    - "bentoml"
    - "pydantic"
    - "requests"
    - "PyJWT"
    - "starlette"
    - "zenml"
    - "joblib"
    - "pytest"
    - "scipy"